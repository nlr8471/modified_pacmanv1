<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pac-Man (VHS Edition)</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-wrap">
      <!-- VHS Outer Box Frame -->
      <div class="vhs-box">
        <div class="vhs-header">
          <span class="vhs-badge">VHS</span>
          <span class="vhs-format">NTSC • SP MODE</span>
          <span class="vhs-badge hi-fi">HI-FI STEREO</span>
        </div>

        <div class="vhs-rainbow-stripe"></div>

        <div class="hud" id="hud">
          <span id="score">Score: 0</span>
          <span id="lives">Lives: 3</span>
          <span id="state">Press Arrow Keys to Start</span>
        </div>

        <!-- Canvas Frame / CRT Screen Area -->
        <div class="vhs-screen-wrap">
          <canvas id="gameCanvas" width="560" height="620" aria-label="Pac-Man game canvas"></canvas>
          <div class="vhs-glare"></div>
        </div>

        <div class="vhs-footer">
          <span class="vhs-tag">T-120 RETRO ARCADE SERIES</span>
          <span class="vhs-rating">RATED: AUTO-PLAY</span>
        </div>
      </div>

      <button id="playAgainBtn" class="play-again-btn" hidden>Play Again</button>
      <p class="help">Controls: Arrow keys or WASD • Refresh to restart</p>
    </main>
    <script src="game.js"></script>
  </body>
</html>
